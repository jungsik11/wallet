

services:
  api:
    image: backend-api:latest
    container_name: fast-api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./api:/app
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  batch-app:
    image: batch-app:latest
    container_name: batch-app
    env_file:
      - ./.env
    volumes:
      - ./batch:/app


networks:
  default:
    name: api-network