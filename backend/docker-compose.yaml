

services:
  api:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: fast-api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./api:/app
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    

networks:
  default:
    name: api-network